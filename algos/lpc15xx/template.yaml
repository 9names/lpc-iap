name: lpc15xx
variants:
- name: lpc1549
  cores:
  - name: main
    type: armv7m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    range:
      start: 0x0
      end: 0x40000
    cores:
    - main
  - !Ram
    range:
      start: 0x2000000
      end: 0x2009000
    cores:
    - main
  flash_algorithms:
  - lpc15xx
flash_algorithms:
- name: lpc15xx
  description: A flash algorithm under test
  default: true
  instructions: 
  pc_init: 0x1
  pc_uninit: 0x2f
  pc_program_page: 0x6b
  pc_erase_sector: 0x45
  pc_erase_all: 0x115
  data_section_offset: 0x2000308
  flash_properties:
    address_range:
      start: 0x0
      end: 0x40000
    page_size: 0x400
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
