name: lpc13xx
variants:
- name: lpc1347
  cores:
  - name: main
    type: armv7m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    range:
      start: 0x0
      end: 0x8000
    cores:
    - main
  - !Ram
    range:
      start: 0x10000000
      end: 0x10001000
    cores:
    - main
  flash_algorithms:
  - lpc13xx
flash_algorithms:
- name: lpc13xx
  description: A flash algorithm under test
  default: true
  instructions: 
  pc_init: 0x1
  pc_uninit: 0x31
  pc_program_page: 0x69
  pc_erase_sector: 0x45
  pc_erase_all: 0xf9
  data_section_offset: 0x10000300
  flash_properties:
    address_range:
      start: 0x0
      end: 0x20000
    page_size: 0x100
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
